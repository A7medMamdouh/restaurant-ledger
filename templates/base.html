<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Ledger</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e0f0c;
      --surface: #161714;
      --surface2: #1e1f1b;
      --border: #2a2b27;
      --accent: #c8a84b;
      --veg: #7ec67e;
      --drink: #5ab4e0;
      --danger: #e07b5a;
      --text: #e8e6df;
      --text2: #8a8880;
      --text3: #5a5955;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }
    .logo {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--accent);
    }
    .logo-sub {
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .nav { padding: 16px 0; }
    .nav-section {
      padding: 8px 20px 4px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text3);
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--text2);
      font-size: 13px;
      text-decoration: none;
      border-left: 2px solid transparent;
      transition: all 0.15s;
    }
    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(200,168,75,0.06);
    }
    .main {
      margin-left: 220px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      padding: 14px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
    }
    .content { padding: 28px 32px; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
    }
    .card.green::before { background: var(--veg); }
    .card.blue::before { background: var(--drink); }
    .card.red::before { background: var(--danger); }
    .card-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
    }
    .card-value {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
      color: var(--text);
    }
    .card-value.accent { color: var(--accent); }
    .card-value.green { color: var(--veg); }
    .card-value.blue { color: var(--drink); }
    .card-value.red { color: var(--danger); }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .table-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .table-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 10px 16px;
      text-align: left;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 11px 16px;
      border-bottom: 1px solid rgba(42,43,39,0.5);
      font-size: 13px;
      color: var(--text2);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.015); }
    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #0e0f0c; }
    .btn-primary:hover { background: #d9b85c; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
    }
    .badge {
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 11px;
    }
    .badge-veg { background: rgba(126,198,126,0.12); color: var(--veg); }
    .badge-drink { background: rgba(90,180,224,0.12); color: var(--drink); }
    .badge-paid { background: rgba(126,198,126,0.12); color: var(--veg); }
    .badge-pending { background: rgba(200,168,75,0.12); color: var(--accent); }
    .mono { font-family: 'DM Mono', monospace; }
    .positive { color: var(--veg); }
    .negative { color: var(--danger); }
    .empty { text-align: center; padding: 40px; color: var(--text3); }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <div class="logo-title">Restaurant<br>Ledger</div>
    <div class="logo-sub">Accounting System</div>
  </div>
  <nav class="nav">
    <div class="nav-section">Overview</div>
    <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">◈ Dashboard</a>
    <div class="nav-section">Operations</div>
    <a href="/sales" class="nav-item {% if request.path == '/sales' %}active{% endif %}">⊕ Daily Sales</a>
    <a href="/purchases" class="nav-item {% if request.path == '/purchases' %}active{% endif %}">⊞ Purchases</a>
    <a href="/expenses" class="nav-item {% if request.path == '/expenses' %}active{% endif %}">⊟ Expenses</a>
    <div class="nav-section">Finance</div>
    <a href="/payroll" class="nav-item {% if request.path == '/payroll' %}active{% endif %}">◎ Payroll</a>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <div class="page-title">{% block title %}{% endblock %}</div>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>
