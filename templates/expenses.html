{% extends 'base.html' %}

{% block title %}Expenses{% endblock %}

{% block content %}

<!-- CARDS -->
<div class="cards-grid" style="grid-template-columns:repeat(4,1fr)">
  <div class="card red">
    <div class="card-label">Rent</div>
    <div class="card-value red mono" id="exp-rent">0.00</div>
  </div>
  <div class="card">
    <div class="card-label">Utilities</div>
    <div class="card-value accent mono" id="exp-util">0.00</div>
  </div>
  <div class="card">
    <div class="card-label">Maintenance</div>
    <div class="card-value accent mono" id="exp-maint">0.00</div>
  </div>
  <div class="card">
    <div class="card-label">Other</div>
    <div class="card-value accent mono" id="exp-other">0.00</div>
  </div>
</div>

<!-- ADD EXPENSE FORM -->
<div class="table-wrap" style="margin-bottom:24px">
  <div class="table-header">
    <div class="table-title">Add New Expense</div>
  </div>
  <div style="padding:20px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">

      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)">Date</label>
        <input type="date" id="e-date" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:9px 12px;color:var(--text);font-size:13px;outline:none">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)">Expense Type</label>
        <select id="e-type" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:9px 12px;color:var(--text);font-size:13px;outline:none">
          <option value="Rent">Rent (611)</option>
          <option value="Utilities">Utilities (612)</option>
          <option value="Maintenance">Maintenance (613)</option>
          <option value="POS/IT">POS / IT (621)</option>
          <option value="Marketing">Marketing (641)</option>
          <option value="Miscellaneous">Miscellaneous (661)</option>
        </select>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)">Amount (EGP)</label>
        <input type="number" id="e-amount" placeholder="0.00" step="0.01" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:9px 12px;color:var(--text);font-size:13px;outline:none">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)">Paid By</label>
        <select id="e-paid-by" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:9px 12px;color:var(--text);font-size:13px;outline:none">
          <option value="Bank">Bank Transfer</option>
          <option value="Cash">Cash</option>
          <option value="Petty Cash">Petty Cash</option>
        </select>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;grid-column:1/-1">
        <label style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)">Description</label>
        <input type="text" id="e-desc" placeholder="Details" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:9px 12px;color:var(--text);font-size:13px;outline:none">
      </div>

    </div>

    <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-primary" onclick="addExpense()">+ Add Expense</button>
    </div>

    <div id="msg" style="margin-top:12px;font-size:13px;display:none"></div>
  </div>
</div>

<!-- EXPENSES TABLE -->
<div class="table-wrap">
  <div class="table-header">
    <div class="table-title">All Expense Records</div>
  </div>
  <table>
    <thead><tr>
      <th>Date</th>
      <th>Type</th>
      <th>Description</th>
      <th>Amount (EGP)</th>
      <th>Paid By</th>
    </tr></thead>
    <tbody id="exp-body">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>
